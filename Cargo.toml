[workspace]
resolver = "3"
members = [
    "crates/approval-policy",
    "crates/artifact-service",
    "crates/auth-middleware",
    "crates/domain-ir",
    "crates/foundation",
    "crates/git-effect-host",
    "crates/history-service",
    "crates/hwpx-package",
    "crates/idempotency-service",
    "crates/job-service",
    "crates/local-companion-daemon",
    "crates/local-sync",
    "crates/local-workflow",
    "crates/mcp-control-plane",
    "crates/mcp-staging-driver",
    "crates/plan-review-staging-driver",
    "crates/operation-engine",
    "crates/product-cli",
    "crates/retention-sync-service",
    "crates/remote-sync-host",
    "crates/remote-sync-wire",
    "crates/revision-service",
    "crates/scheduler-service",
    "protocol/generated/rust",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", features = ["std"] }
hex = "=0.4.3"
hmac = { version = "=0.13.0", features = ["zeroize"] }
jsonschema = { version = "=0.53.0", default-features = false }
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
postgres = { version = "=0.19.14", default-features = false, features = ["with-uuid-1"] }
protoc-bin-vendored = "=3.2.0"
quick-xml = { version = "=0.42.0", default-features = false }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.26.0", features = ["serde", "v4", "v5"] }
zeroize = "=1.9.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
